<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d2d"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <radialGradient id="tire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1c252b"/>
      <stop offset="0.45" stop-color="#10161b"/>
      <stop offset="0.75" stop-color="#0b0f12"/>
      <stop offset="1" stop-color="#070a0c"/>
    </radialGradient>
  </defs>

  <!-- Full-size tyre background -->
  <circle cx="64" cy="64" r="60" fill="url(#tire)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#1f2a33" stroke-width="3"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#0f1418" stroke-width="10"/>
  <circle cx="64" cy="64" r="30" fill="#121a20"/>
  <circle cx="64" cy="64" r="16" fill="#0b0f12"/>

  <!-- Tread details -->
  <g stroke="#1b252c" stroke-width="4" stroke-linecap="round">
    <path d="M16 64h14"/>
    <path d="M98 64h14"/>
    <path d="M64 16v14"/>
    <path d="M64 98v14"/>
    <path d="M27 27l10 10"/>
    <path d="M91 91l10 10"/>
    <path d="M27 101l10-10"/>
    <path d="M91 27l10-10"/>
  </g>

  <!-- Checkered flag (diagonal wave + pole) -->
  <g transform="translate(58 18) rotate(-12 0 0)">
    <rect x="-3" y="-2" width="4" height="34" rx="2" fill="#2b3640"/>
    <path d="M0 0c10-6 22-6 32 0v24c-12 6-22 6-32 0z" fill="#e6edf3"/>
    <path d="M0 12c10-6 22-6 32 0" fill="none" stroke="#c6d0da" stroke-width="1.5"/>
    <rect x="2" y="2" width="8" height="8" fill="#0f1418"/>
    <rect x="18" y="2" width="8" height="8" fill="#0f1418"/>
    <rect x="10" y="10" width="8" height="8" fill="#0f1418"/>
    <rect x="26" y="10" width="6" height="8" fill="#0f1418"/>
    <rect x="2" y="18" width="8" height="6" fill="#0f1418"/>
    <rect x="18" y="18" width="8" height="6" fill="#0f1418"/>
  </g>

  <!-- Pit lane stripe -->
  <rect x="20" y="58" width="88" height="8" rx="4" fill="url(#accent)"/>

  <!-- Center label -->
  <rect x="30" y="50" width="68" height="28" rx="14" fill="#0f1418" stroke="#2b3640" stroke-width="2"/>
  <text x="64" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">pit.</text>
</svg>
